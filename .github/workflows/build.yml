name: Build

# Every branch gets typechecked + tested + built (so a bad merge is caught before
# it lands on main). Tags additionally publish a downloadable extension package.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A superseded run on the same ref has nothing to say; cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 校验并打包
    runs-on: ubuntu-latest
    outputs:
      # Version comes from the manifest, because that is the number Chrome reads.
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Version consistency (manifest / package / lock)
        id: version
        run: |
          node scripts/check-version.mjs
          echo "version=$(node scripts/check-version.mjs --plain)" >> "$GITHUB_OUTPUT"

      # The repo rule (AGENTS.md §1): a change under src/ must move the version in the
      # same commit. Consistency alone does not catch "bumped nothing at all", which is
      # how three changes ended up sharing one version number.
      - name: 版本号必须随内容更新
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_MANIFEST: ${{ runner.temp }}/base-manifest.json
        run: |
          set -uo pipefail

          base=""
          if [ "$EVENT" = "pull_request" ] && [ -n "${BASE_REF:-}" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF" && base=FETCH_HEAD
          elif [ "$EVENT" = "push" ] && [ -n "${BEFORE_SHA:-}" ] \
               && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA" && base="$BEFORE_SHA"
          fi

          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "[version-guard] 没有可比较的基准（新分支 / 强制推送），跳过"
            exit 0
          fi

          if git diff --quiet "$base" HEAD -- src; then
            echo "[version-guard] src/ 无改动，不要求升版本号"
            exit 0
          fi

          git show "$base:public/manifest.json" > "$BASE_MANIFEST"
          previous="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.BASE_MANIFEST,"utf8")).version)')"
          current="$(node scripts/check-version.mjs --plain)"
          echo "[version-guard] 基准 $previous -> 当前 $current"

          if [ "$previous" = "$current" ]; then
            echo "::error::src/ 有改动但版本号仍是 $current。按 AGENTS.md：npm run version:bump patch"
            exit 1
          fi
          echo "[version-guard] OK"

      - name: Build
        run: npm run build

      - name: Verify dist completeness
        run: npm run check:dist

      - name: Package extension
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          # -X drops extra attributes; a reproducible-ish zip with manifest.json at
          # the ROOT, which is what "load unpacked" / a packed .crx requires.
          zip -r -X "../aliexpress-image-editor-v${VERSION}.zip" .

      - name: Verify the package is loadable
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG="aliexpress-image-editor-v${VERSION}.zip"
          unzip -l "$PKG" | awk '{print $4}' > "$RUNNER_TEMP/entries.txt"
          # Chrome loads a zip only if manifest.json sits at the ARCHIVE ROOT; a
          # nested folder is the classic "打包成功但加载不了" failure, and it never
          # shows up in the build log.
          for required in manifest.json service-worker.js content-script.js options/index.html editor/index.html; do
            if ! grep -qx "$required" "$RUNNER_TEMP/entries.txt"; then
              echo "::error::zip 根部缺少 $required（解压后在子目录里就加载不了）"
              exit 1
            fi
          done
          if ! grep -qx 'vendor/aeiir/bridge.js' "$RUNNER_TEMP/entries.txt"; then
            echo "::error::zip 缺少回填注入脚本 vendor/aeiir/bridge.js"
            exit 1
          fi
          echo "[package] OK：$(wc -l < "$RUNNER_TEMP/entries.txt") 个条目，manifest.json 在根部"

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: aliexpress-image-editor-v${{ steps.version.outputs.version }}
          path: aliexpress-image-editor-v${{ steps.version.outputs.version }}.zip
          retention-days: 30
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: aliexpress-image-editor-v${{ needs.verify.outputs.version }}
          path: release

      - name: Check tag matches the manifest version
        env:
          TAG_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # Pushing v0.9.0 while the manifest still says 0.8.0 would publish a
          # release whose contents disagree with its own title. Refuse instead.
          if [ "v${MANIFEST_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::tag ${TAG_VERSION} 与 manifest 版本 v${MANIFEST_VERSION} 不一致"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "v${VERSION}" release/*.zip \
            --verify-tag \
            --title "v${VERSION}" \
            --notes "可直接加载的扩展包（Chrome 114+）。

          安装：解压 \`aliexpress-image-editor-v${VERSION}.zip\`，打开 \`chrome://extensions\` → 开发者模式 → 加载已解压的扩展程序 → 选择解压出的目录。

          本版本要点：模板驱动的智能排版（左侧特写 + 右上包装盒 + 左上型号 + 底部留白），
          没有包装盒时按兜底链换成另一张素材 / 衬板 / 留空；素材角色可用本地视觉模型（glm-5.3）自动识别。"
